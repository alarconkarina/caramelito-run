<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caramelito Run</title>
  <!--
    NOTA: Este juego requiere un servidor local para funcionar correctamente.
    Abre con Live Server (VS Code) u otro servidor HTTP local.
    NO abrir con protocolo file://, ya que los assets no cargarán.
  -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Phaser 3 desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- Escenas del juego (deben cargarse antes de main.js) -->
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/GameOverScene.js"></script>

  <!-- Configuración principal del juego -->
  <script src="src/main.js"></script>
</body>
</html>
